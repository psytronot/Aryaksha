name: Aryaksha CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-build-and-tests:
    name: Web build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Report dependency audit findings (non-blocking)
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit-all.json || true
          npm audit --omit=dev --json > /tmp/npm-audit-production.json || true
          node <<'NODE'
          const fs = require('node:fs');
          for (const [label, path] of [
            ['all dependencies', '/tmp/npm-audit-all.json'],
            ['production dependencies', '/tmp/npm-audit-production.json']
          ]) {
            let report;
            try {
              report = JSON.parse(fs.readFileSync(path, 'utf8'));
            } catch {
              console.log(`AUDIT ${label}: report could not be parsed; inspect npm output.`);
              continue;
            }
            const vulnerabilities = report.vulnerabilities || {};
            const counts = report.metadata?.vulnerabilities || {};
            console.log(`AUDIT ${label}: total=${counts.total ?? Object.keys(vulnerabilities).length} critical=${counts.critical ?? 0} high=${counts.high ?? 0} moderate=${counts.moderate ?? 0} low=${counts.low ?? 0}`);
            for (const [name, item] of Object.entries(vulnerabilities)) {
              const via = (item.via || []).map(value => typeof value === 'string' ? value : `${value.name || name}: ${value.title || value.range || 'advisory'}`).join('; ');
              console.log(`  ${item.severity} ${name} range=${item.range || 'unknown'} fixAvailable=${JSON.stringify(item.fixAvailable)} via=${via}`);
            }
          }
          NODE
      - run: npm run typecheck
      - run: npm test
      - run: npm run build




  browser-e2e:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    needs: [web-build-and-tests]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e

  orekit-service:
    name: Orekit service build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f orekit-service/pom.xml test

  live-integration-smoke:
    name: Live Orekit integration smoke tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [web-build-and-tests, orekit-service]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Verify deployed API security headers
        shell: bash
        env:
          WEB_URL: https://aryaksha-web.onrender.com
        run: |
          for attempt in $(seq 1 18); do
            status=$(curl --silent --show-error --max-time 15 -D /tmp/security-headers.txt -o /tmp/security-health.json -w '%{http_code}' "$WEB_URL/api/v1/health" || true)
            if [ "$status" = "200" ] && grep -qi '^x-content-type-options: nosniff' /tmp/security-headers.txt && grep -qi '^x-frame-options: DENY' /tmp/security-headers.txt && grep -qi '^referrer-policy: strict-origin-when-cross-origin' /tmp/security-headers.txt && grep -qi "^content-security-policy-report-only:.*default-src 'self'" /tmp/security-headers.txt && grep -qi "connect-src 'self' https://celestrak.org" /tmp/security-headers.txt; then
              cat /tmp/security-health.json
              echo "Live API security headers are present."
              exit 0
            fi
            echo "Security headers not yet present or service rollout incomplete (attempt $attempt/18; HTTP ${status:-000})"
            sleep 10
          done
          exit 1

      - name: Verify deployed API rejects out-of-contract requests
        shell: bash
        env:
          WEB_URL: https://aryaksha-web.onrender.com
        run: |
          validated=false
          for attempt in $(seq 1 18); do
            status=$(curl --silent --show-error --max-time 15 -o /tmp/string-orbit.json -w '%{http_code}' -H 'content-type: application/json' -d '{"altitudeKm":"550","inclinationDeg":"97.6","eccentricity":"0.001"}' "$WEB_URL/api/mission-analysis/orbit" || true)
            if [ "$status" = "400" ] && node -e 'const p=require("/tmp/string-orbit.json"); if (typeof p.error!=="string" || p.error.length===0) process.exit(1);'; then
              validated=true
              break
            fi
            echo "Strict JSON-number validation not active yet (attempt $attempt/18; HTTP ${status:-000})"
            sleep 10
          done
          test "$validated" = true

          status=$(curl --silent --show-error --max-time 15 -o /tmp/extra-orbit.json -w '%{http_code}' -H 'content-type: application/json' -d '{"altitudeKm":550,"inclinationDeg":97.6,"eccentricity":0.001,"unexpected":true}' "$WEB_URL/api/mission-analysis/orbit" || true)
          test "$status" = "400"
          node -e 'const p=require("/tmp/extra-orbit.json"); if (typeof p.error!=="string" || p.error.length===0) process.exit(1);'

          status=$(curl --silent --show-error --max-time 15 -D /tmp/null-headers.txt -o /tmp/null-body.json -w '%{http_code}' -H 'content-type: application/json' -d 'null' "$WEB_URL/api/mission-analysis/orbit" || true)
          test "$status" = "400"
          grep -qi '^content-type: application/json' /tmp/null-headers.txt
          node -e 'const p=require("/tmp/null-body.json"); if (typeof p.error!=="string" || p.error.length===0) process.exit(1);'
          echo "Live API rejects numeric strings, unknown fields and null bodies with JSON errors."

      - name: Wait for the deployed Orekit service
        shell: bash
        env:
          OREKIT_URL: https://aryaksha-orekit.onrender.com
        run: |
          for attempt in $(seq 1 12); do
            if curl --silent --show-error --fail --max-time 70 "$OREKIT_URL/api/v1/health" -o /tmp/orekit-health.json; then
              if node -e 'const p=require("/tmp/orekit-health.json"); if (p.status!=="ok" || p.engine!=="Orekit" || p.version!=="13.1.9") process.exit(1);'; then
                cat /tmp/orekit-health.json
                exit 0
              fi
            fi
            echo "Orekit service not ready yet (attempt $attempt/12)"
            sleep 10
          done
          exit 1

      - name: Verify live backend returns Orekit numerical results
        shell: bash
        env:
          WEB_URL: https://aryaksha-web.onrender.com
        run: |
          for attempt in $(seq 1 18); do
            status=$(curl --silent --show-error --max-time 75 -o /tmp/orbit-analysis.json -w '%{http_code}' -H 'content-type: application/json' -d '{"altitudeKm":550,"inclinationDeg":97.6,"eccentricity":0.001}' "$WEB_URL/api/mission-analysis/orbit" || true)
            if [ "$status" = "200" ] && node -e 'const p=require("/tmp/orbit-analysis.json"); if (p.valid!==true || p.engine!=="Orekit" || p.comparison?.engineAdapter!=="orekit-http" || p.comparison?.status!=="connected" || !Number.isFinite(p.orbit?.periodMinutes) || Math.abs(p.orbit.periodMinutes-95.64988)>0.02 || p.state?.frame!=="EME2000" || p.state?.timeScale!=="TAI" || p.state?.epoch!=="2000-01-01T11:59:27.816" || p.state?.positionKm?.length!==3 || p.state?.velocityKmS?.length!==3) process.exit(1);'; then
              cat /tmp/orbit-analysis.json
              exit 0
            fi
            echo "Mission analysis proxy not ready or invalid (attempt $attempt/18; HTTP ${status:-000})"
            sleep 10
          done
          exit 1

      - name: Validate live orbit-analysis response against the v1 JSON Schema
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const Ajv = require('ajv');
          const schema = require('./schemas/orbit-analysis-response.v1.schema.json');
          const payload = JSON.parse(fs.readFileSync('/tmp/orbit-analysis.json', 'utf8'));
          const validate = new Ajv({ allErrors: true, strict: true }).compile(schema);
          if (!validate(payload)) {
            console.error(JSON.stringify(validate.errors, null, 2));
            process.exit(1);
          }
          console.log('Live orbit-analysis response conforms to schema v1.');
          NODE

      - name: Verify the deployed Earth-intersection guardrail
        shell: bash
        env:
          WEB_URL: https://aryaksha-web.onrender.com
        run: |
          status=$(curl --silent --show-error --max-time 30 -o /tmp/invalid-orbit.json -w '%{http_code}' -H 'content-type: application/json' -d '{"altitudeKm":120,"inclinationDeg":45,"eccentricity":0.02}' "$WEB_URL/api/mission-analysis/orbit" || true)
          test "$status" = "400"
          node -e 'const p=require("/tmp/invalid-orbit.json"); if (typeof p.error!=="string" || !p.error.includes("intersects Earth")) process.exit(1);'
      - name: Validate live API error envelope against the v1 JSON Schema
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const Ajv = require('ajv');
          const schema = require('./schemas/api-error.v1.schema.json');
          const payload = JSON.parse(fs.readFileSync('/tmp/invalid-orbit.json', 'utf8'));
          const validate = new Ajv({ allErrors: true, strict: true }).compile(schema);
          if (!validate(payload)) {
            console.error(JSON.stringify(validate.errors, null, 2));
            process.exit(1);
          }
          console.log('Live API error conforms to schema v1.');
          NODE

  live-browser-smoke:
    name: Live deployed UI smoke tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [browser-e2e, live-integration-smoke]
    env:
      PLAYWRIGHT_BASE_URL: https://aryaksha-web.onrender.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/live-ui-smoke.spec.ts
