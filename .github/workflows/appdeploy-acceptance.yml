name: AppDeploy nine-scenario browser acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/appdeploy-acceptance.yml'
      - 'playwright.appdeploy.config.ts'
      - 'tests/e2e/appdeploy-acceptance.spec.ts'
      - 'tests/tests.json'
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appdeploy-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-appdeploy-acceptance:
    name: Execute nine AppDeploy acceptance scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Capture non-blocking live endpoint timing diagnostics
        shell: bash
        continue-on-error: true
        run: |
          probe() {
            name="$1"
            url="$2"
            body="$(mktemp)"
            echo "endpoint=$name"
            curl --silent --show-error --connect-timeout 10 --max-time 70 \
              -o "$body" \
              -w 'http_code=%{http_code} remote_ip=%{remote_ip} dns_s=%{time_namelookup} connect_s=%{time_connect} tls_s=%{time_appconnect} ttfb_s=%{time_starttransfer} total_s=%{time_total}\n' \
              "$url"
            rc=$?
            if [ "$rc" -ne 0 ]; then echo "curl_exit=$rc"; fi
            if [ -s "$body" ]; then head -c 500 "$body"; echo; fi
            rm -f "$body"
          }
          probe "render-web-health" "https://aryaksha-web.onrender.com/api/v1/health" &
          probe "render-orekit-health" "https://aryaksha-orekit.onrender.com/api/v1/health" &
          probe "appdeploy-backend-health" "https://orbital-lab-lq22ug.v2.appdeploy.ai/api/_healthcheck" &
          wait
      - name: Execute desktop and mobile AppDeploy acceptance scenarios
        env:
          APPDEPLOY_BASE_URL: https://orbital-lab-lq22ug.v2.appdeploy.ai/
        run: npx playwright test --config=playwright.appdeploy.config.ts
      - name: Upload AppDeploy acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appdeploy-nine-scenario-browser-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
