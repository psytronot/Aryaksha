name: Scheduled production health

on:
  workflow_dispatch:
  schedule:
    # 09:00 Asia/Kolkata daily
    - cron: '30 3 * * *'

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: false

jobs:
  render-health:
    name: Verify live Render services
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check web API health and security headers
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          result="$(curl --silent --show-error --connect-timeout 10 --max-time 75 -D "$headers" -o "$body" -w '%{http_code} %{time_namelookup} %{time_connect} %{time_appconnect} %{time_starttransfer} %{time_total}' https://aryaksha-web.onrender.com/api/v1/health)"
          status="${result%% *}"
          timings="${result#* }"
          echo "web_http=$status dns_connect_tls_ttfb_total_seconds=$timings"
          test "$status" = "200"
          grep -qi '^x-content-type-options: nosniff' "$headers"
          grep -qi '^x-frame-options: DENY' "$headers"
          grep -qi '^referrer-policy: strict-origin-when-cross-origin' "$headers"
          grep -qi "^content-security-policy-report-only:.*default-src 'self'" "$headers"
          node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (!p || typeof p !== "object" || Array.isArray(p)) process.exit(1);' "$body"
          cat "$body"
      - name: Check Orekit health and engine version
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          result="$(curl --silent --show-error --connect-timeout 10 --max-time 75 -o "$body" -w '%{http_code} %{time_namelookup} %{time_connect} %{time_appconnect} %{time_starttransfer} %{time_total}' https://aryaksha-orekit.onrender.com/api/v1/health)"
          status="${result%% *}"
          timings="${result#* }"
          echo "orekit_http=$status dns_connect_tls_ttfb_total_seconds=$timings"
          test "$status" = "200"
          node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (p.status!=="ok" || p.engine!=="Orekit" || p.version!=="13.1.9") process.exit(1);' "$body"
          cat "$body"

  render-provenance:
    name: Verify live Render deployment provenance
    needs: [render-health]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_SHA: ${{ github.sha }}
      GITHUB_REF: ${{ github.ref }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Compare exact live Render commits with canonical main
        run: node .github/scripts/verify-render-provenance.mjs
