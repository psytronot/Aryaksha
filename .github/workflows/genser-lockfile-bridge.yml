name: Temporary GENSER lockfile bridge

on:
  push:
    branches:
      - automation/genser-lockfile-bridge
    paths:
      - package.json
      - .github/workflows/genser-lockfile-bridge.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate lockfile with clean install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: genser-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
